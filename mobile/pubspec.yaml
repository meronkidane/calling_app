name: calling_app
description: Production-ready international calling app frontend
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.3
  dio: ^5.4.3+1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  flutter_secure_storage: ^9.2.2
  firebase_core: ^3.4.0
  firebase_messaging: ^15.0.4
  flutter_callkit_incoming: ^1.1.4+2
  flutter_sip_ua: ^0.4.3
  libphonenumber_plugin: ^0.3.3
  intl: ^0.19.0
  logging: ^1.2.0
  web_socket_channel: ^3.0.0
  riverpod_annotation: ^2.3.3
  collection: ^1.18.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  build_runner: ^2.4.11
  freezed: ^2.4.7
  json_serializable: ^6.9.2
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/en_US.json
    - assets/i18n/am_ET.json
    - assets/i18n/ti_ER.json
